<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Interactive equipment for kids | KIDSjumpTECH</title>
    <meta name="description" content="Turn-Key Interactive Systems for Your Environment" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Open Sans"', 'sans-serif'],
              heading: ['"Lorin"', '"Nunito"', 'sans-serif'],
            },
            colors: {
              border: "hsl(var(--border))",
              input: "hsl(var(--input))",
              ring: "hsl(var(--ring))",
              background: "hsl(var(--background))",
              foreground: "hsl(var(--foreground))",
              brand: {
                sky: "#00AAE8",
                dark: "#1A1A1A",
                gray: "#F4F5FA",
                orange: "#FF5722",
                // Gradient Stops available as solid colors
                start: "#FF5757", // Red
                mid: "#FF4CC9",   // Pink
                end: "#EDD83F",   // Yellow/Gold
                // Feature Icons
                green: "#7CB342",
                gold: "#C5A365",
              },
              social: {
                facebook: "#1877F2",
                instagram: "#E4405F",
                linkedin: "#0A66C2",
                youtube: "#FF0000",
              },
              ui: {
                dot: "#D9D9D9",
                star: "#FFB400",
              },
              footer: {
                bg: "#000000",
                bar: "#1C1F21",
              }
            },
            backgroundImage: {
              'brand-gradient': 'linear-gradient(90deg, #FF5757 0%, #FF4CC9 47%, #EDD83F 100%)',
            },
            boxShadow: {
              'glow': '0 0 20px rgba(0, 170, 232, 0.3)',
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --background: 0 0% 100%;
        --foreground: 222.2 84% 4.9%;
        --border: 214.3 31.8% 91.4%;
        --input: 214.3 31.8% 91.4%;
        --ring: 221.2 83.2% 53.3%;
        
        /* Brand Colors as CSS Vars for SVGs */
        --brand-start: #FF5757;
        --brand-end: #EDD83F;
      }
      
      @font-face {
        font-family: 'Lorin';
        src: url('https://kidsjumptech.com/wp-content/uploads/2023/03/Lorin-Bold.woff2') format('woff2'),
             url('https://kidsjumptech.com/wp-content/uploads/2023/03/Lorin-Bold.woff') format('woff');
        font-weight: bold;
        font-style: normal;
        font-display: swap;
      }

      body {
        font-family: 'Open Sans', sans-serif;
        -webkit-font-smoothing: antialiased;
        background-color: #F4F5FA;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Lorin', 'Nunito', sans-serif;
      }
      .hide-scroll::-webkit-scrollbar {
        display: none;
      }
      .hide-scroll {
        -ms-overflow-style: none; 
        scrollbar-width: none; 
      }
      
      @keyframes text_fill_animation {
        0%, 100% {
            filter: hue-rotate(0deg);
        }
        50% {
            filter: hue-rotate(360deg);
        }
      }
      .animate-gradient {
        animation: text_fill_animation 8s infinite;
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/client": "https://aistudiocdn.com/react-dom@^19.2.0/client",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "clsx": "https://aistudiocdn.com/clsx@^2.1.1",
    "tailwind-merge": "https://aistudiocdn.com/tailwind-merge@^2.3.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
