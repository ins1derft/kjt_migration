# HTTP -> HTTPS редирект
server {
    listen 80;
    server_name kids.webmolot.pro;

    return 301 https://$host$request_uri;
}

# Основной сервер на HTTPS
server {
    listen 443 ssl http2;
    server_name kids.webmolot.pro;

    ssl_certificate     /etc/letsencrypt/live/kids.webmolot.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kids.webmolot.pro/privkey.pem;

    root /var/www/backend/public;
    index index.php index.html;

    client_max_body_size 20m;

    # Block search engine indexing in all environments
    add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;

    # дальше просто ВСТАВЛЯЕШЬ свой старый конфиг:
    location ^~ /admin {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Robots: block indexing explicitly
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location ^~ /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /build/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /storage/ {
        alias /var/www/backend/storage/app/public/;
        add_header Access-Control-Allow-Origin *;
        access_log off;
        expires 7d;
    }

    location ^~ /vendor/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass backend-php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    location ^~ /_next/ {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }
}
